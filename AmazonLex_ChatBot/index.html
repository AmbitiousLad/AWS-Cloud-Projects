	<script src="https://sdk.amazonaws.com/js/aws-sdk-2.633.0.min.js"></script>

	<style>
		/* General Reset */
		body {
			margin: 0;

		/* Header */
		#chatHeader {
			background: #4a90e2;
			color: #fff;
			text-align: center;
			padding: 15px 0;
			font-size: 1.5em;
			font-weight: 700;
			letter-spacing: 1px;

		/* Chat Area */
		#conversation {
			flex-grow: 1;
			padding: 10px;
			background: #f8f9fa;
			overflow-y: auto;
			scroll-behavior: smooth;
		}

		/* Custom Scrollbar */

			width: 6px;
		}

		#conversation::-webkit-scrollbar-thumb {
			background: #ddd;
			border-radius: 3px;
		}

		/* Input Area */

		#chatform input:focus {

</head>

<body>
	<div id="chatContainer">
		<div id="chatHeader">Amazon Lex Chatbot</div>
		<div id="conversation"></div>
		<form id="chatform" onsubmit="return pushChat();">
			<input type="text" id="wisdom" placeholder="Ask your question..." autocomplete="off">
		</form>
	</div>

	<script>
		// JavaScript remains unchanged
		document.getElementById("wisdom").focus();
		AWS.config.region = 'us-east-1';
		AWS.config.credentials = new AWS.CognitoIdentityCredentials({
			IdentityPoolId: 'us-east-1:ba843dcb-6ca6-4b75-b357-2341ac234949',
		});

		var lexruntime = new AWS.LexRuntime();
		var lexUserId = 'chatbot-demo' + Date.now();
		var sessionAttributes = {};

		function pushChat() {
			var wisdomText = document.getElementById('wisdom');
			if (wisdomText && wisdomText.value.trim().length > 0) {
				var wisdom = wisdomText.value.trim();
				wisdomText.value = '';
				showRequest(wisdom);
				lexruntime.postText({
					botAlias: 'MyChatBot',
					botName: 'DentalAppointment',
					inputText: wisdom,
					userId: lexUserId,
					sessionAttributes: sessionAttributes
				}, function (err, data) {
					if (err) showError(err.message);
					else showResponse(data);
				});
			}
			return false;
		}

		function showRequest(text) {
			var conversation = document.getElementById('conversation');
			var requestPara = document.createElement('p');
			requestPara.className = 'userRequest';
			requestPara.textContent = text;
			conversation.appendChild(requestPara);
			conversation.scrollTop = conversation.scrollHeight;
		}

		function showResponse(lexResponse) {
			var conversation = document.getElementById('conversation');
			var responsePara = document.createElement('p');
			responsePara.className = 'lexResponse';
			responsePara.textContent = lexResponse.message;
			conversation.appendChild(responsePara);
			conversation.scrollTop = conversation.scrollHeight;
		}

		function showError(text) {
			var conversation = document.getElementById('conversation');
			var errorPara = document.createElement('p');
			errorPara.className = 'lexError';
			errorPara.textContent = text;
			conversation.appendChild(errorPara);
			conversation.scrollTop = conversation.scrollHeight;
		}
	</script>
</body>

</html>
